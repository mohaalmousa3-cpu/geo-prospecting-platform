# Merged over docker-compose.yml by scripts/image_smoke.sh ONLY (CI and `make image-smoke`): the fixtures-only
# mode for the API and the worker, and nothing published on the host (the client runs inside the backend
# container). Not a deployment file; it adds no service, no host and no credential.
services:
  postgis:
    # The base healthcheck asks over the unix socket, which answers while the image's init-time server is still
    # up (measured on a cold start: socket-ready ~1 s, TCP-ready ~3 s). A service connecting in that gap would be
    # refused, so the smoke stack asks over TCP, as its services connect. (This race is real but was NOT the
    # cause of the CI failure of run #18; that was the password mismatch handled in scripts/image_smoke.sh.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  backend:
    environment:
      CONNECTOR_MODE: fixture
    ports: !reset []
  worker:
    environment:
      CONNECTOR_MODE: fixture
