repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(apps/frontend/package-lock.json|uv.lock|apps/backend/tests/snapshots/)
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # local hooks use the locked ruff version, so pre-commit and CI cannot drift apart
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd apps/frontend && npx --no-install prettier --check .'
        language: system
        pass_filenames: false
        files: ^apps/frontend/
      - id: scientific-guards
        name: forbidden-term and policy guards
        entry: uv run pytest tests/scientific -q
        language: system
        pass_filenames: false
