[project]
name = "geo-backend"
version = "0.1.0"
description = "FastAPI backend (Phase 1 skeleton)"
requires-python = ">=3.12"
dependencies = [
  "geo-common",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "defusedxml>=0.7",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
