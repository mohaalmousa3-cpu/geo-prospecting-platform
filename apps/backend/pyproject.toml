[project]
name = "geo-backend"
version = "0.1.0"
description = "FastAPI backend (Phase 1 skeleton)"
requires-python = ">=3.12"
dependencies = ["geo-common", "fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
