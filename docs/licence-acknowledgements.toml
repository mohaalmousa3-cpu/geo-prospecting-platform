# Owner acknowledgements of weak-copyleft / unusual licences — version-controlled source of truth.
#
# STATUS: documented record. It is NOT yet read by scripts/licences.py: making the generator and its check
# consume this file and render it into docs/third-party-licences.md is code and is left to a separately
# authorised task (ADR-0014 §10). Until then the generated register is unchanged (it still says "nothing here
# has been approved") and APPROVED_COPYLEFT in the script is still empty. This file does not weaken any check.
#
# RULES (ADR-0014 §10): only decisions supported by actual owner messages are recorded here; nothing is inferred
# retroactively; strong-copyleft and unknown cases remain blocked; a new version or a new component needs a new
# record. "source_message" points to where the owner's message is TRANSCRIBED in the repository (the transcriptions
# are by Claude and are not independently signed records).
#
# Fields: id, status, decision_date, owner_decision, source_message, scope, conditions, [[acknowledgement.components]]
# (name, ecosystem, version, licence, artifact_class).

[[acknowledgement]]
id = "OA-0001"
status = "recorded"
decision_date = "2026-10-04"
owner_decision = "Phase 1 acceptance with follow-up checks, decision 3: weak-copyleft packages acknowledged; strong copyleft stays blocked"
source_message = "Owner message 'Phase 1 is accepted with follow-up checks, not fully closed yet' (decision 3); transcribed in docs/phase-reports/phase-1-closeout.md section 1, item 3"
scope = "exactly the packages listed under 'Pending owner acknowledgement' in docs/third-party-licences.md when Phase 1 was accepted (Phase 1 report section 7, item 1); versions below are those listed in the register at that time and still listed on 2026-10-05"
conditions = [
  "used unmodified as dependencies; no vendored or modified source",
  "does not block Phase 2 (as stated in the closeout)",
  "strong copyleft (GPL/AGPL/EUPL/SSPL) remains blocked by scripts/licences.py",
  "applies to these versions only; a new version or a new component needs a new record",
]

