# Owner acknowledgements of weak-copyleft / unusual licences — version-controlled record.
#
# STATUS (updated 2026-10-06, F1-8): the `[[acknowledgement]]`, `[[pending]]` and `[[unsupported]]` records below are
# a documented record that scripts/licences.py does NOT read. The generator reads ONLY the `[[approved]]` records at the
# end of this file: the narrow MPL-2.0-only policy decided by the owner on 2026-10-06 (see there). APPROVED_COPYLEFT in
# the script is still empty. Nothing in this file weakens any check: strong copyleft and unknown licences stay
# blocked, and anything without an exact `[[approved]]` match stays "pending".
#
# RULES: only decisions supported by actual owner messages are recorded; nothing is inferred retroactively;
# strong-copyleft and unknown cases remain blocked. "observed_version" is evidence of what the generated register
# listed when the decision was made; it is NOT approved scope. Nothing here approves redistribution, licence
# compliance, or any condition the owner did not state. A historical acknowledgement is not extended to Phase 3
# (or any later phase) automatically. The transcriptions of owner messages in this repository were written by
# Claude and are not independently signed records.
#
# CORRECTION 2026-10-05: the first version of this file (commit 6b8d15e) overstated OA-0001 (it dropped "for now",
# listed 29 components as acknowledged, presented versions as scope and added conditions the owner did not state).
# The owner approved the narrow correction below on 2026-10-05.

