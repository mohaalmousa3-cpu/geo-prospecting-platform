[project]
name = "geo-runner"
version = "0.1.0"
description = "Generic worker loop with noop handler (no analysis logic)"
requires-python = ">=3.12"
dependencies = ["geo-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]
