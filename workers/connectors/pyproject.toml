[project]
name = "geo-connectors"
version = "0.1.0"
description = "Data-access connectors (Phase 3a fixtures-only connector; Phase 3b R8 offline egress policy and an unregistered urllib3 transport proof of concept; no live path, no analysis)"
requires-python = ">=3.12"
dependencies = ["geo-common", "urllib3==2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_connectors"]
