[project]
name = "geo-connectors"
version = "0.1.0"
description = "Data-access connectors (Phase 3a: contracts, registry and an offline fixture connector; no HTTP client, no analysis)"
requires-python = ">=3.12"
dependencies = ["geo-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_connectors"]
