[project]
name = "geo-prospecting-platform"
version = "0.0.0"
description = "Workspace root (not published)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/pycommon", "apps/backend", "workers/runner", "workers/connectors"]

[tool.uv.sources]
geo-common = { workspace = true }
geo-backend = { workspace = true }
geo-runner = { workspace = true }
geo-connectors = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "datamodel-code-generator>=0.25",
  "jsonschema>=4.22",
  "geo-common", "geo-backend", "geo-runner", "geo-connectors",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["packages/pycommon/src/geo_common/models/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "E501"]
"tests/**" = ["S", "B", "E501"]
"scripts/licences.py" = ["E501"]  # long lines are generated markdown

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["_generated\\.py$"]

[tool.pytest.ini_options]
testpaths = ["packages/pycommon/tests", "apps/backend/tests", "workers/runner/tests", "workers/connectors/tests", "tests"]
timeout = 120
markers = ["integration: needs a PostGIS database (GEO_TEST_DATABASE_URL)"]

[tool.ruff.lint.isort]
known-first-party = ["geo_common", "geo_connectors", "app", "runner", "forbidden_terms", "handlers_for_tests"]
